plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

configurations.configureEach {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
}

android {
    namespace 'org.omnione.did.ca'
    compileSdk 34

    defaultConfig {
        applicationId "org.omnione.did.ca"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def isProd = project.hasProperty('isProdMode') && project.property('isProdMode').toBoolean()

        if (isProd) {
            // 운영(Prod) 모드 URL
            def serverUrl = "\"http://192.168.3.130";
            buildConfigField "String", "TAS_URL", serverUrl+":18090\""
            buildConfigField "String", "CAS_URL", serverUrl+":18094\""
            buildConfigField "String", "API_GW_URL", serverUrl+":18093\""
            buildConfigField "String", "VERIFIER_URL", serverUrl+":18092\""
            buildConfigField "String", "WALLET_URL", serverUrl+":18095\""
            buildConfigField "String", "DEMO_URL", serverUrl+":18099\""
            buildConfigField "String", "OBSERVER_URL", serverUrl+":18080\""
            buildConfigField "boolean", "IS_PROD_MODE", "true"
        } else {
            // 개발(Dev) 모드 URL
            def serverUrl = "\"http://10.48.17.123";
            buildConfigField "String", "TAS_URL", serverUrl+":8090\""
            buildConfigField "String", "CAS_URL", serverUrl+":8094\""
            buildConfigField "String", "API_GW_URL", serverUrl+":8093\""
            buildConfigField "String", "VERIFIER_URL", serverUrl+":8092\""
            buildConfigField "String", "DATA_PORTAL_URL", serverUrl+":8099\""
            buildConfigField "String", "WALLET_URL", serverUrl+":8095\""
            buildConfigField "String", "DEMO_URL", serverUrl+":8099\""
            buildConfigField "String", "OBSERVER_URL", serverUrl+":18080\""
            buildConfigField "boolean", "IS_PROD_MODE", "false"
        }

        // ─── 자동화 테스트 설정 ───────────────────────────
        // 자동화 테스트 VP 제출 클레임 수별 Policy ID. setup-admin-policy.sh 실행 후 출력된 값을 입력.
        buildConfigField "String", "AUTO_TEST_VP_POLICY_ID_5", "\"41bfb315-826a-4eae-b4e7-31c2a967c8b6\""
        buildConfigField "String", "AUTO_TEST_VP_POLICY_ID_50", "\"41f1e6eb-52bd-4cd3-b760-c0eab497fe24\""
        buildConfigField "String", "AUTO_TEST_VP_POLICY_ID_100", "\"a19b7909-4b3f-42e6-b5a6-a26699a792aa\""
        // 자동화 테스트 반복 시 사용할 PIN 고정값
        buildConfigField "String", "AUTO_TEST_PIN", "\"000000\""
        // PQC 성능 테스트 메뉴 노출 여부 (개발 모드에서만 표시)
        buildConfigField "boolean", "SHOW_PERF_TEST", isProd ? "false" : "true"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    dataBinding {
        enabled = true
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }
}

dependencies {
    implementation project(':did-wallet-sdk-aos')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.google.firebase:firebase-messaging:20.0.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'

    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.7"

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'org.bitcoinj:bitcoinj-core:0.15.7'

    implementation 'com.madgag.spongycastle:core:1.54.0.0'
    implementation 'com.madgag.spongycastle:prov:1.54.0.0'
    implementation 'com.madgag.spongycastle:pkix:1.54.0.0'
    implementation 'com.madgag.spongycastle:pg:1.54.0.0'

    // PQC: BouncyCastle 1.80 required by did-wallet-sdk-aos for ML-DSA-44
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'

    api "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
}
apply plugin: 'com.google.gms.google-services'

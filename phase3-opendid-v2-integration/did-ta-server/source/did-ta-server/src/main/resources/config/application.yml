spring:
  application:
    name: Tas
  profiles:
    active: dev, lss
    group:
        dev:
          - auth
          - databases
          - wallet
          - logging
          - spring-docs
          - setup
          - blockchain
        sample:
          - auth
          - databases-sample
          - wallet
          - logging
          - spring-docs
          - setup
        lss:
          - lss
  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include:
          - "health"
          - "shutdown"
  endpoint:
    health:
      show-details: "never"
    shutdown:
      enabled: true

server:
  port: 8090

observer:
  enabled: false # did-observer-server 호출 ON/OFF (성능 측정 시 false 권장)
  url: http://127.0.0.1:18080
  service-name: did-ta-server

setup:
  key-algorithm: MlDsa44 # PQC: MlDsa44 또는 Secp256r1

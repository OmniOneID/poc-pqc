<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Report</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Menlo, Consolas, Monaco, monospace;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 24px;
            background: #161b22;
            border-bottom: 1px solid #30363d;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .nav {
            display: flex;
            gap: 4px;
            align-items: center;
        }
        .nav-link {
            color: #8b949e;
            text-decoration: none;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 6px;
            transition: background 0.15s, color 0.15s;
            border: 1px solid transparent;
        }
        .nav-link:hover { background: #21262d; color: #c9d1d9; }
        .nav-link.active {
            color: #f0f6fc;
            border-color: #30363d;
            background: #21262d;
        }
        h1 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
            color: #f0f6fc;
            flex: 1;
            text-align: center;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #8b949e;
            min-width: 140px;
            justify-content: flex-end;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f85149;
            transition: background 0.3s;
        }
        .dot.connected { background: #3fb950; }

        main {
            flex: 1;
            padding: 24px;
            max-width: 1100px;
            margin: 0 auto;
            width: 100%;
        }
        .empty {
            text-align: center;
            color: #8b949e;
            padding: 80px 0;
            font-size: 14px;
        }

        /* ── Report card ── */
        .report-card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

        .card-header {
            padding: 14px 18px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #21262d;
        }
        .badge {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 12px;
            letter-spacing: 0.3px;
        }
        /* Scenario badges */
        .badge-A { background: #2e1b1a; color: #f85149; }
        .badge-B { background: #1b2d4f; color: #58a6ff; }
        .badge-C { background: #352d13; color: #e3b341; }
        .badge-D { background: #2e2043; color: #d2a8ff; }
        /* Algorithm badges */
        .algo-pqc-dsa    { background: #1c3a22; color: #3fb950; }
        .algo-classic     { background: #1b2d4f; color: #58a6ff; }
        .algo-pqc-kem    { background: #2e2043; color: #d2a8ff; }
        .algo-ecdh        { background: #3b2413; color: #f0883e; }

        .card-subtitle {
            font-size: 11px;
            color: #8b949e;
            flex: 1;
        }
        .card-meta {
            font-size: 11px;
            color: #6e7681;
            margin-left: auto;
            white-space: nowrap;
        }
        .card-config {
            padding: 8px 18px;
            font-size: 11px;
            color: #6e7681;
            border-bottom: 1px solid #21262d;
            background: #0d1117;
        }
        .card-config span { margin-right: 14px; }
        .card-config span b { color: #8b949e; }

        /* ── Metric table ── */
        .table-wrap {
            overflow-x: auto;
            padding: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 9px 16px;
            text-align: right;
            white-space: nowrap;
            border-bottom: 1px solid #21262d;
        }
        th:first-child, td:first-child {
            text-align: left;
            color: #8b949e;
            font-weight: 600;
            width: 90px;
        }
        th {
            background: #1c2128;
            color: #8b949e;
            font-size: 12px;
            font-weight: 600;
            border-bottom: 2px solid #30363d;
        }
        th:first-child { color: #6e7681; }
        tbody tr:last-child td { border-bottom: none; }
        tbody tr:hover td { background: #1c2128; }
        tbody tr td { color: #4a5260; }
        tbody tr td:first-child { color: #4a5260; }
        tr.row-p50 td { color: #f85149; font-weight: 700; }
        tr.row-p50 td:first-child { color: #f85149; }
        .unit { font-size: 10px; color: #6e7681; margin-left: 4px; }

        .no-data { color: #6e7681; font-size: 12px; padding: 20px 18px; text-align: center; }
    </style>
</head>
<body>
<header>
    <nav class="nav">
        <a href="/observer" class="nav-link">로그</a>
        <a href="/report" class="nav-link active">리포트</a>
    </nav>
    <h1>Performance Report</h1>
    <div class="status">
        <div class="dot" id="dot"></div>
        <span id="statusText">연결 중...</span>
    </div>
</header>

<main id="reportList">
    <div class="empty" id="emptyState">아직 수신된 리포트가 없습니다<br><span style="font-size:12px;color:#6e7681">Android 자동화 테스트가 완료되면 여기에 표시됩니다</span></div>
</main>

<script>
    const SCENARIO_INFO = {
        A: { label: 'Scenario A', subtitle: 'REG → VC 발급 → VP 제출  (전체 흐름)' },
        B: { label: 'Scenario B', subtitle: 'VC 발급 (P210) 반복 측정' },
        C: { label: 'Scenario C', subtitle: 'VP 제출 (P310) 반복 측정' },
        D: { label: 'Scenario D', subtitle: '키교환 단독 측정' },
    };

    const COLUMN_LABELS = {
        A: { reg: 'P132 등록', issue: 'P210 발급', vp: 'P310 제출', total: 'Total' },
        B: { total: 'P210 전체', server: '서버 API', app: '앱 내부' },
        C: { total: 'P310 전체', server: '서버 API', app: '앱 내부' },
        D: { roundtrip: 'Roundtrip', server: 'Server', network: 'Network', clientCrypto: 'Client Crypto' },
    };

    function algoClass(algo) {
        if (!algo) return 'algo-classic';
        const a = algo.toLowerCase();
        if (a.includes('mldsa') || a.includes('ml-dsa')) return 'algo-pqc-dsa';
        if (a.includes('ml-kem') || a.includes('mlkem')) return 'algo-pqc-kem';
        if (a.includes('ecdh')) return 'algo-ecdh';
        return 'algo-classic';
    }

    function scenarioBadgeClass(s) {
        return 'badge badge-' + (s || 'A');
    }

    function claimsLabel(vcPlanId) {
        if (!vcPlanId) return '';
        const m = vcPlanId.match(/\.(\d+)$/);
        return m ? m[1] + ' 클레임' : vcPlanId;
    }

    function fmtTs(ts) {
        if (!ts) return '';
        try {
            const d = new Date(ts);
            const pad = n => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} `
                 + `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
        } catch { return ts; }
    }

    function fmtMs(v) {
        if (v == null) return '-';
        return v.toFixed(2);
    }

    function renderReport(report) {
        const card = document.createElement('div');
        card.className = 'report-card';

        const info = SCENARIO_INFO[report.scenario] || { label: 'Scenario ' + report.scenario, subtitle: '' };
        const colLabels = COLUMN_LABELS[report.scenario] || {};
        const metrics = report.metrics || {};
        const keys = Object.keys(metrics);

        // ── Header ──
        const hdr = document.createElement('div');
        hdr.className = 'card-header';

        const sBadge = document.createElement('span');
        sBadge.className = scenarioBadgeClass(report.scenario);
        sBadge.textContent = info.label;
        hdr.appendChild(sBadge);

        if (report.algorithm) {
            const aBadge = document.createElement('span');
            aBadge.className = 'badge ' + algoClass(report.algorithm);
            aBadge.textContent = report.algorithm;
            hdr.appendChild(aBadge);
        }

        const subtitle = document.createElement('span');
        subtitle.className = 'card-subtitle';
        subtitle.textContent = info.subtitle;
        hdr.appendChild(subtitle);

        const meta = document.createElement('span');
        meta.className = 'card-meta';
        meta.textContent = fmtTs(report.timestamp);
        hdr.appendChild(meta);

        card.appendChild(hdr);

        // ── Config ──
        const cfg = document.createElement('div');
        cfg.className = 'card-config';

        const configParts = [];
        if (report.vcPlanId) configParts.push(`<span><b>클레임:</b> ${claimsLabel(report.vcPlanId)}</span>`);
        if (report.vpPolicyId) configParts.push(`<span><b>VP policy:</b> ${report.vpPolicyId}</span>`);
        configParts.push(`<span><b>warmup:</b> ${report.warmupCount}회 제외</span>`);
        configParts.push(`<span><b>측정:</b> ${report.measurementCount}회</span>`);
        cfg.innerHTML = configParts.join('');
        card.appendChild(cfg);

        // ── Table ──
        if (keys.length === 0) {
            const nd = document.createElement('div');
            nd.className = 'no-data';
            nd.textContent = '측정 데이터 없음';
            card.appendChild(nd);
            return card;
        }

        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        const tbl = document.createElement('table');

        // thead
        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        const unitTh = document.createElement('th');
        unitTh.innerHTML = '(ms)';
        headRow.appendChild(unitTh);
        keys.forEach(k => {
            const th = document.createElement('th');
            th.textContent = colLabels[k] || k;
            headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        tbl.appendChild(thead);

        // tbody
        const tbody = document.createElement('tbody');
        const statRows = [
            { key: 'mean', label: 'mean', cls: 'row-mean' },
            { key: 'p50',  label: 'p50',  cls: 'row-p50' },
            { key: 'p95',  label: 'p95',  cls: 'row-p95' },
            { key: 'min',  label: 'min',  cls: 'row-min' },
            { key: 'max',  label: 'max',  cls: 'row-max' },
        ];
        statRows.forEach(({ key, label, cls }) => {
            const tr = document.createElement('tr');
            tr.className = cls;

            const labelTd = document.createElement('td');
            labelTd.textContent = label;
            tr.appendChild(labelTd);

            keys.forEach(metricKey => {
                const td = document.createElement('td');
                const val = metrics[metricKey] ? metrics[metricKey][key] : null;
                td.textContent = fmtMs(val);
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        });
        tbl.appendChild(tbody);
        wrap.appendChild(tbl);
        card.appendChild(wrap);

        return card;
    }

    function addReport(report) {
        const list = document.getElementById('reportList');
        const empty = document.getElementById('emptyState');
        if (empty) empty.remove();

        const card = renderReport(report);
        list.insertBefore(card, list.firstChild);
    }

    // ── SSE ──
    let es;
    function connect() {
        es = new EventSource('/api/report-stream');

        es.addEventListener('report', e => {
            try {
                addReport(JSON.parse(e.data));
            } catch(err) {
                console.error('report parse error', err);
            }
        });

        es.onopen = () => {
            document.getElementById('dot').classList.add('connected');
            document.getElementById('statusText').textContent = '실시간 연결됨';
        };

        es.onerror = () => {
            document.getElementById('dot').classList.remove('connected');
            document.getElementById('statusText').textContent = '연결 끊김 — 재연결 중';
            es.close();
            setTimeout(connect, 3000);
        };
    }

    connect();
</script>
</body>
</html>

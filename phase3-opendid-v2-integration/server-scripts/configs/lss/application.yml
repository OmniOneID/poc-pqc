spring:
  profiles:
    active: dev, lss
  jpa:
    show-sql: false # 성능 측정 시 Hibernate SQL 출력 끔

springdoc:
  server:
    url: http://10.48.17.123:4141

logging:
  level:
    root: ERROR # 성능 측정 시 로그 최소화

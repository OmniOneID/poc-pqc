spring:
  application:
    name: demo
  profiles:
    default: dev
    group:
        dev:
          - logging
          - spring-docs
          - demo
  jackson:
    default-property-inclusion: non_null


tas:
  url: http://10.48.17.123:8090

issuer:
  url: http://10.48.17.123:8091

verifier:
  url: http://10.48.17.123:8092

cas:
  url: http://10.48.17.123:8094

server:
  port: 8099

management:
  endpoints:
    web:
      exposure:
        include:
          - "health"
          - "shutdown"
  endpoint:
    health:
      show-details: "never"
    shutdown:
      enabled: true
app:
  config:
    file-path: ${CONFIG_FILE_PATH:./config/config.json}

logging:
  level:
    root: ERROR # 성능 측정 시 로그 최소화
    # application-logging.yml(내부)에서 debug로 설정된 패키지를 명시적으로 덮어씀
    org.omnione: ERROR
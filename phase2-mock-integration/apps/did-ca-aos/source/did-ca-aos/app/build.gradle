plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'org.omnione.did.ca'
    compileSdk 34

    defaultConfig {
        applicationId "org.omnione.did.ca"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        def isProd = project.hasProperty('isProdMode') && project.property('isProdMode').toBoolean()

        //def serverUrl = "\"http://10.48.201.106";
        def serverUrl = "\"http://10.48.17.127";
        //def serverUrl = "\"http://10.0.2.2";
        buildConfigField "String", "TAS_URL", serverUrl+":8084\""
            buildConfigField "String", "CAS_URL", serverUrl+":8084\""
            buildConfigField "String", "API_GW_URL", serverUrl+":8084\""
            buildConfigField "String", "VERIFIER_URL", serverUrl+":8084\""
            buildConfigField "String", "DATA_PORTAL_URL", serverUrl+":8084\""
            buildConfigField "String", "WALLET_URL", serverUrl+":8084\""
            buildConfigField "String", "DEMO_URL", serverUrl+":8084\""
            buildConfigField "boolean", "IS_PROD_MODE", "true"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    dataBinding {
        enabled = true
    }

    buildFeatures {
        viewBinding true
        dataBinding true
        buildConfig true
    }

    packagingOptions {
        resources {
            pickFirsts += ['org/bouncycastle/**']
        }
    }
}

configurations.all {
    exclude group: 'org.bouncycastle', module: 'bcprov-jdk15to18'
}

dependencies {
//    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(':did-wallet-sdk-aos')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.navigation:navigation-fragment:2.7.7'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.google.firebase:firebase-messaging:20.0.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'

    implementation "androidx.navigation:navigation-fragment-ktx:2.7.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.7"

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation('org.bitcoinj:bitcoinj-core:0.15.7') {
        exclude group: 'org.bouncycastle'
    }

    implementation 'com.madgag.spongycastle:core:1.54.0.0'
    implementation 'com.madgag.spongycastle:prov:1.54.0.0'
    implementation 'com.madgag.spongycastle:pkix:1.54.0.0'
    implementation 'com.madgag.spongycastle:pg:1.54.0.0'

    // BouncyCastle 1.80 for ML-DSA-44 (PQC) support
    implementation 'org.bouncycastle:bcprov-jdk18on:1.80'

    api "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
}
apply plugin: 'com.google.gms.google-services'